name: Actualizar servidores

# Consulta la API pública de Roblox cada 5 minutos y guarda la lista real de
# servidores públicos en data/servers.json. La página la lee desde el mismo
# dominio, así no depende de CORS en el navegador.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar API de Roblox
        run: python3 scripts/fetch_servers.py
      - name: Guardar cambios
        run: |
          git config user.name "delta-x-radar-bot"
          git config user.email "bot@deltaxcommunity.local"
          git add data/servers.json
          git diff --cached --quiet || git commit -m "Actualizar lista de servidores [skip ci]"
          git push
